[project]
name = "llm-grouping-loss-inria"
version = "0.1.0"
description = "LLM Grouping Loss Analysis - Measuring confidence calibration bias across entity clusters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers==5.1.2",
    "transformers>=4.57.0,<5.0.0",
    "accelerate>=0.24.0",
    "bitsandbytes==0.48.2",
    "pyyaml>=6.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tqdm>=4.65.0",
    "scipy>=1.11.0",
    "nltk>=3.9.2",
    "umap-learn>=0.5.9.post2",
    "plotly>=6.5.0",
    "nbformat>=5.10.4",
    "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
